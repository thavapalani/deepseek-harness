name: DeepSeek Harness

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: dsh-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  dsh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/dsh '))
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node dist/src/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-flash' }}
          DSH_PLUGINS: ${{ vars.DSH_PLUGINS || 'spec-kit,graphify,documentation' }}
          DSH_TRUSTED_ISSUES_ONLY: ${{ vars.DSH_TRUSTED_ISSUES_ONLY || 'true' }}
          DSH_TEST_COMMANDS: ${{ vars.DSH_TEST_COMMANDS || 'npm test,npm run check,npm run build' }}
